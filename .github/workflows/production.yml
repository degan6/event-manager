# Production: versioned images and git tags on every push to `main`.
name: Production

on:
  push:
    branches:
      - main

# Updated per deployment protocol
permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  docker:
    name: Build and push production image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Updated per deployment protocol — compare push tip to github.event.before (not HEAD~1), so merge/squash/rebase to main all compare correctly.
      - name: Read APP_VERSION and enforce VERSION bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          normalize() { tr -d '[:space:]' | sed 's/^[vV]//'; }
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            PREV_NORMALIZED="0"
          else
            PREV_NORMALIZED=$(git show "${BEFORE_SHA}:VERSION" 2>/dev/null | normalize || echo "0")
          fi
          CURR_NORMALIZED=$(normalize < VERSION)
          if [ "$PREV_NORMALIZED" = "$CURR_NORMALIZED" ]; then
            echo "ERROR: VERSION did not change on this push to main (still ${CURR_NORMALIZED}). Bump VERSION on the release branch before merging."
            echo "If this is wrong, ensure the commit updating VERSION is included in the push (before SHA was ${BEFORE_SHA:-empty})."
            exit 1
          fi
          # Pass through raw VERSION for image tags (keep v prefix if present)
          CURR=$(tr -d '[:space:]' < VERSION)
          echo "APP_VERSION=$CURR" >> "$GITHUB_ENV"
          echo "VERSION_MAJOR=$(echo "$CURR_NORMALIZED" | cut -d. -f1)" >> "$GITHUB_ENV"
          # Build the git tag from the normalized version so a VERSION file that
          # already carries a v prefix does not yield a doubled "vv0.1.2" tag.
          echo "RELEASE_TAG=v${CURR_NORMALIZED}" >> "$GITHUB_ENV"
          echo "Using APP_VERSION=$CURR"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Updated per deployment protocol
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Updated per deployment protocol — :latest, :semver, :major
      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ env.APP_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ env.VERSION_MAJOR }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:buildcache,mode=max

      # Updated per deployment protocol
      - name: Create and push release git tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read APP_VERSION from VERSION
        id: ver
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image to scan
        run: docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.VERSION }}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.VERSION }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.39.3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.VERSION }}
          format: table
          severity: CRITICAL,HIGH
