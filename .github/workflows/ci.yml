# Required status check for branch protection: add a job named "ci" (see job id + name below).
# After the first run, enable "ci" under Settings → Branches → protection rules for staging and main.
name: ci

on:
  pull_request:
    branches:
      - staging
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: test_secret_key_base_for_ci
      # Deliberately not DATABASE_URL: it pins one database name and would
      # override the per-process name parallel_tests needs, putting both test
      # processes in the same database where they deadlock on each other.
      DATABASE_HOST: localhost
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: eventmanager_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true

      - name: Install Ruby dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Run linter (RuboCop)
        run: bundle exec rubocop --parallel

      # This app does not use Sorbet, Steep, or a JS type checker; keep a no-op so the pipeline documents the slot.
      - name: Type checker (not applicable)
        run: echo "No static type checker is configured in this repository."

      - name: Cache Node modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Setup databases
        run: |
          bundle exec rails "parallel:create[2]" "parallel:load_schema[2]"

      - name: Precompile assets for test
        run: |
          yarn build
          yarn build:css

      - name: Run tests
        run: bundle exec parallel_rspec spec/ -n 2 --verbose
        env:
          DISABLE_SPRING: 1

  # Runs the suite sequentially with coverage enabled. Kept separate from `ci`
  # because SimpleCov's minimum_coverage check only sees the whole suite in a
  # single process; under parallel_rspec it would compare against a partially
  # merged result and fail intermittently.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: test_secret_key_base_for_ci
      DATABASE_HOST: localhost
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: eventmanager_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true

      - name: Install Ruby dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Cache Node modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Setup database
        run: bundle exec rails db:test:prepare

      - name: Precompile assets for test
        run: |
          yarn build
          yarn build:css

      - name: Run tests with coverage
        run: bundle exec rspec
        env:
          DISABLE_SPRING: 1
          COVERAGE: 1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
